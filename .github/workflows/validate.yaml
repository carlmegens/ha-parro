name: Validate

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          comment: false
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  tests:
    name: Python tests (HA ${{ matrix.ha }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha: '2026.8.3'
            plugin: '0.13.357'
          - ha: '2026.10.4'
            plugin: '0.13.375'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v6
      - name: Install test dependencies
        run: |
          uv venv
          printf 'homeassistant==%s\npytest-homeassistant-custom-component==%s\n' '${{ matrix.ha }}' '${{ matrix.plugin }}' > /tmp/parro-test-overrides.txt
          uv pip install -r requirements-test.txt --override /tmp/parro-test-overrides.txt
      - run: uv run --no-project ruff check custom_components tests scripts
      - run: uv run --no-project pytest
      - run: uv run --no-project python scripts/prepare_repository.py --check
  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix tests/frontend --ignore-scripts
      - run: cd tests/frontend && npx playwright install --with-deps chromium
      - name: Test card and device popups
        run: |
          node tests/frontend/serve.mjs > /tmp/parro-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8766/tests/frontend/index.html > /dev/null; then break; fi
            sleep 1
          done
          npm test --prefix tests/frontend
